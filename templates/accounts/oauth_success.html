<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Success - Meeting App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: none;
            border-radius: 15px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card success-card">
                    <div class="card-body p-5 text-center">
                        <div class="mb-4">
                            <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                            <h2 class="fw-bold">OAuth Authentication Successful!</h2>
                            <p class="text-muted">Setting up your account...</p>
                        </div>
                        
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        
                        <div class="mt-4">
                            <p class="mb-2">Redirecting to dashboard in <span id="countdown">3</span> seconds...</p>
                            <a href="/video/dashboard/" class="btn btn-primary">
                                <i class="fas fa-tachometer-alt me-2"></i>Go to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get JWT tokens for the authenticated OAuth user
        async function getOAuthTokens() {
            try {
                const response = await fetch('/api/accounts/auth/google/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Store JWT tokens
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    
                    console.log('OAuth tokens stored successfully');
                    return true;
                } else {
                    console.error('Failed to get OAuth tokens');
                    return false;
                }
            } catch (error) {
                console.error('Error getting OAuth tokens:', error);
                return false;
            }
        }

        // Countdown and redirect
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = '/video/dashboard/';
            }
        }, 1000);

        // Get tokens on page load
        document.addEventListener('DOMContentLoaded', () => {
            getOAuthTokens();
        });
    </script>
</body>
</html>
