services:
  - type: web
    name: meetingapp-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_SECRET_KEY
        scope: secret
      - key: DATABASE_URL
        scope: secret

databases:
  - name: meetingapp-db
    plan: hobby-basic
